<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test WiterOK API</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        max-width: 1200px;
        margin: 40px auto;
        padding: 20px;
        background: #f5f7fa;
      }

      h1 {
        color: #144073;
      }

      .button-group {
        margin: 20px 0;
        display: flex;
        gap: 10px;
      }

      button {
        padding: 12px 24px;
        background: linear-gradient(135deg, #144073, #1a6dcc);
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
      }

      button:hover {
        opacity: 0.9;
      }

      .result {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        margin-top: 20px;
      }

      .status {
        padding: 10px 20px;
        border-radius: 6px;
        margin-bottom: 20px;
        font-weight: 600;
      }

      .status.success {
        background: #d4edda;
        color: #155724;
      }

      .status.error {
        background: #f8d7da;
        color: #721c24;
      }

      .status.info {
        background: #d1ecf1;
        color: #0c5460;
      }

      pre {
        background: #2d2d2d;
        color: #f8f8f2;
        padding: 20px;
        border-radius: 6px;
        overflow-x: auto;
        font-size: 14px;
        line-height: 1.5;
      }

      .news-card {
        border: 1px solid #dee2e6;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 15px;
      }

      .news-card img {
        max-width: 200px;
        border-radius: 6px;
        margin-top: 10px;
      }

      .news-card h3 {
        color: #144073;
        margin-bottom: 10px;
      }

      .news-card .meta {
        color: #666;
        font-size: 13px;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <h1>🧪 Тест WiterOK News API</h1>

    <div class="button-group">
      <button onclick="testAPI()">📡 Перевірити API</button>
      <button onclick="openAdmin()">🔧 Відкрити адмінку</button>
      <button onclick="openAPIDirectly()">🌐 Відкрити API в браузері</button>
    </div>

    <div id="result"></div>

    <script>
      const API_URL = "https://witerok.com/api/posts.php";

      async function testAPI() {
        const resultDiv = document.getElementById("result");
        resultDiv.innerHTML =
          '<div class="status info">🔄 Завантаження...</div>';

        try {
          console.log("Testing API:", API_URL);

          const response = await fetch(API_URL);
          const status = response.status;
          const statusText = response.statusText;

          console.log("Response status:", status, statusText);

          if (!response.ok) {
            throw new Error(`HTTP ${status}: ${statusText}`);
          }

          const data = await response.json();
          console.log("Response data:", data);

          let html = `<div class="status success">✅ API працює! Статус: ${status} ${statusText}</div>`;
          html += `<div class="result">`;
          html += `<h2>📊 Отримано новин: ${data.length}</h2>`;

          if (data.length === 0) {
            html += `
                        <div class="status error">
                            ⚠️ API повертає 0 новин!<br><br>
                            <strong>Що перевірити:</strong><br>
                            1. Чи додані новини в адмінці? <br>
                            2. Чи статус новини = "Опублікована" (не "Чернетка")? <br>
                            3. Чи правильно налаштована база даних?
                        </div>
                    `;
          } else {
            html += `<h3>📰 Новини:</h3>`;
            data.forEach((post, index) => {
              html += `
                            <div class="news-card">
                                <h3>${index + 1}. ${post.title}</h3>
                                <div class="meta">
                                    ID: ${post.id} | Дата: ${post.date}
                                </div>
                                <p>${post.excerpt}</p>
                                ${
                                  post.image
                                    ? `<img src="${post.image}" alt="${post.title}">`
                                    : "<em>Без зображення</em>"
                                }
                            </div>
                        `;
            });
          }

          html += `<h3>🔍 Raw JSON:</h3>`;
          html += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
          html += `</div>`;

          resultDiv.innerHTML = html;
        } catch (error) {
          console.error("Error:", error);
          resultDiv.innerHTML = `
                    <div class="status error">
                        ❌ Помилка при підключенні до API<br><br>
                        <strong>Помилка:</strong> ${error.message}<br><br>
                        <strong>Можливі причини:</strong><br>
                        1. Файл posts.php не завантажений на сервер<br>
                        2. Неправильний шлях: має бути public_html/api/posts.php<br>
                        3. Проблеми з CORS (перевірте заголовки в posts.php)<br>
                        4. Проблеми з wp-load.php (перевірте шлях в posts.php)
                    </div>
                    <div class="result">
                        <h3>🔍 Деталі помилки:</h3>
                        <pre>${error.stack || error.message}</pre>
                    </div>
                `;
        }
      }

      function openAdmin() {
        window.open("https://witerok.com/admin/news.php", "_blank");
      }

      function openAPIDirectly() {
        window.open(API_URL, "_blank");
      }

      // Автоматично запускаємо тест при завантаженні
      window.addEventListener("load", () => {
        testAPI();
      });
    </script>
  </body>
</html>
